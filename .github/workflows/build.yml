name: Build ArtCraft APK (manual)

# CHỈ chạy khi bấm "Run workflow" — không auto-build khi push/PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag/commit/branch cần build (BẮT BUỘC — ví dụ: v0.12.0, a1b2c3d, main)'
        required: true
        default: ''
        type: string
      app:
        description: 'App cần build'
        required: true
        default: 'photocraft'
        type: choice
        options:
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft
          - all
      build_type:
        description: 'Loại build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      appname:
        description: 'Override Android display name (để trống = mặc định)'
        required: false
        default: ''
        type: string
      packagename:
        description: 'Override package name (để trống = com.artcraft.<app>)'
        required: false
        default: ''
        type: string

jobs:
  # Job 1: In danh sách tag/branch/commit để tham khảo trước khi build
  show-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Show available versions
        run: |
          echo "=========================================="
          echo "  VERSION ĐANG CHỌN: ${{ inputs.version }}"
          echo "=========================================="
          echo ""
          echo "=== TAGS (version) có sẵn ==="
          git tag --sort=-v:refname | head -50 || echo "(chưa có tag nào)"
          echo ""
          echo "=== BRANCHES gần đây ==="
          git branch -r --sort=-committerdate | head -20
          echo ""
          echo "=== 10 COMMIT gần nhất ==="
          git log --oneline -10
          echo ""
          echo "=========================================="

  # Job 2: Kiểm tra version có tồn tại không (fail sớm nếu sai)
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      resolved_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version -> commit SHA
        id: resolve
        run: |
          REF="${{ inputs.version }}"
          echo "Đang kiểm tra: $REF"
          if ! SHA=$(git rev-parse --verify "$REF^{commit}" 2>/dev/null); then
            echo "::error::Không tìm thấy version '$REF'."
            echo ""
            echo "=== Tags có sẵn ==="
            git tag --sort=-v:refname | head -30
            echo ""
            echo "=== Branches có sẵn ==="
            git branch -r | head -20
            echo ""
            echo "=== Commits gần nhất ==="
            git log --oneline -10
            exit 1
          fi
          echo "OK: $REF -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=format:'Commit: %H%nAuthor: %an%nDate:   %ad%nSubject: %s' "$SHA"
          echo ""

  # Job 3: Build
  build:
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ inputs.app != 'all' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["photocraft","vectorcraft","filmcraft","lightcraft","pdfcraft","effectcraft","designcraft","figcraft","wordcraft","soundcraft","deckcraft","cadcraft","gridcraft"]') }}

    steps:
      - name: Checkout đúng version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.resolved_sha }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Show version info
        run: |
          echo "Building app: ${{ matrix.app }}"
          echo "From version: ${{ inputs.version }}"
          echo "Commit: ${{ needs.validate-version.outputs.resolved_sha }}"
          git log -1 --oneline

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            android-sdk
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('lib/*.py') }}
          restore-keys: android-${{ runner.os }}-

      - name: Install Rust + targets
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install cargo-ndk
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip pkg-config libssl-dev \
            libxcb1-dev libxkbcommon-dev zip unzip

      # --- Build release ---
      - name: Build ${{ matrix.app }} (release)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          EXTRA=""
          [ -n "${{ inputs.appname }}" ] && EXTRA="$EXTRA -appname=${{ inputs.appname }}"
          [ -n "${{ inputs.packagename }}" ] && EXTRA="$EXTRA -packagename=${{ inputs.packagename }}"
          bash build.sh -${{ matrix.app }} $EXTRA 2>&1 | tee -a "logs/build-${{ matrix.app }}-release.log"

      # --- Build debug ---
      - name: Build ${{ matrix.app }} (debug)
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          EXTRA=""
          [ -n "${{ inputs.appname }}" ] && EXTRA="$EXTRA -appname=${{ inputs.appname }}"
          [ -n "${{ inputs.packagename }}" ] && EXTRA="$EXTRA -packagename=${{ inputs.packagename }}"
          bash build-debug.sh -${{ matrix.app }} $EXTRA 2>&1 | tee -a "logs/build-${{ matrix.app }}-debug.log"

      - name: Upload logs (nếu fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.app }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ inputs.version }}-${{ github.run_id }}
          path: output/*.apk
          if-no-files-found: warn

  # Job 4: Gom tất cả APK
  collect:
    needs: [validate-version, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          pattern: apk-*
          merge-multiple: true

      - name: List APKs
        run: |
          echo "=== APK đã build từ version ${{ inputs.version }} ==="
          find all-apks -name "*.apk" -exec ls -lh {} \;

      - name: Upload combined APKs
        uses: actions/upload-artifact@v4
        with:
          name: ALL-APKs-${{ inputs.version }}-${{ github.run_id }}
          path: all-apks/
          if-no-files-found: warn
