name: Build ArtCraft APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version cần build (tag, branch, hoặc commit SHA — để trống = branch hiện tại)'
        required: false
        default: ''
        type: string
      app:
        description: 'App cần build'
        required: true
        default: 'photocraft'
        type: choice
        options:
          - all
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft
      build_type:
        description: 'Loại build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      appname:
        description: 'Override Android display name (để trống = mặc định)'
        required: false
        default: ''
        type: string
      packagename:
        description: 'Override package name (để trống = com.artcraft.<app>)'
        required: false
        default: ''
        type: string

jobs:
  # Job 0: Liệt kê các version có sẵn để tham khảo (chạy trước, in ra log)
  list-versions:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.version == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: List available versions (tags + recent branches)
        run: |
          echo "=== Available tags (versions) ==="
          git tag --sort=-v:refname | head -30 || echo "(no tags)"
          echo ""
          echo "=== Recent branches ==="
          git branch -r --sort=-committerdate | head -20
          echo ""
          echo "=== Latest 10 commits ==="
          git log --oneline -10

  # Job 1: Build
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ github.event_name == 'workflow_dispatch' && inputs.app != 'all' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["photocraft","vectorcraft","filmcraft","lightcraft","pdfcraft","effectcraft","designcraft","figcraft","wordcraft","soundcraft","deckcraft","cadcraft","gridcraft"]') }}

    steps:
      # 1. Checkout đúng version
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || github.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Show checked-out version
        run: |
          echo "Building from ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || github.ref }}"
          git log -1 --pretty=format:'%H %s' || true
          echo ""
          git describe --tags --always 2>/dev/null || echo "(no tag)"

      # 2. JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Rust
      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      # 5. Cache Android SDK/NDK
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            android-sdk
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('lib/*.py') }}
          restore-keys: android-${{ runner.os }}-

      # 6. Rust + targets
      - name: Install Rust and Android targets
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 7. cargo-ndk
      - name: Install cargo-ndk
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      # 8. Dependencies hệ thống
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip pkg-config libssl-dev \
            libxcb1-dev libxkbcommon-dev zip unzip

      # 9. Build release
      - name: Build ${{ matrix.app }} (release)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          EXTRA=""
          [ -n "${{ inputs.appname }}" ] && EXTRA="$EXTRA -appname=${{ inputs.appname }}"
          [ -n "${{ inputs.packagename }}" ] && EXTRA="$EXTRA -packagename=${{ inputs.packagename }}"
          bash build.sh -${{ matrix.app }} $EXTRA 2>&1 | tee -a "logs/build-${{ matrix.app }}-release.log"

      # 10. Build debug
      - name: Build ${{ matrix.app }} (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_type == 'debug' || inputs.build_type == 'both') }}
        run: |
          EXTRA=""
          [ -n "${{ inputs.appname }}" ] && EXTRA="$EXTRA -appname=${{ inputs.appname }}"
          [ -n "${{ inputs.packagename }}" ] && EXTRA="$EXTRA -packagename=${{ inputs.packagename }}"
          bash build-debug.sh -${{ matrix.app }} $EXTRA 2>&1 | tee -a "logs/build-${{ matrix.app }}-debug.log"

      # 11. Upload log nếu fail
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.app }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ github.run_id }}
          path: output/*.apk
          if-no-files-found: warn

  # Job 2: Gom APK
  collect:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          pattern: apk-*
          merge-multiple: true

      - name: List and upload combined
        run: find all-apks -name "*.apk" -exec ls -lh {} \;

      - name: Upload combined APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks-${{ github.run_id }}
          path: all-apks/
          if-no-files-found: warn
