name: Build ArtCraft APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (photocraft, vectorcraft, filmcraft, lightcraft, pdfcraft, effectcraft, designcraft, figcraft, wordcraft, soundcraft, deckcraft, cadcraft, gridcraft, hoặc "all" để build tất cả)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      appname:
        description: 'Override Android display name (để trống = dùng mặc định)'
        required: false
        default: ''
      packagename:
        description: 'Override package name (để trống = com.artcraft.<app>)'
        required: false
        default: ''

jobs:
  # Job 1: Build từng app một
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # Build Rust + NDK cho nhiều app có thể mất 1-2 giờ

    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'workflow_dispatch' && inputs.app != 'all' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["photocraft","vectorcraft","filmcraft","lightcraft","pdfcraft","effectcraft","designcraft","figcraft","wordcraft","soundcraft","deckcraft","cadcraft","gridcraft"]') }}

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Repo có vendor/ nên cần submodule

      # 2. Cài JDK 21 (repo yêu cầu JDK 17-23; 21 là LTS)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Cài Android SDK (repo tự tải nếu không có, nhưng cache giúp nhanh hơn)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Cargo registry + NDK + SDK để tăng tốc build
      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            android-sdk
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('lib/*.py') }}
          restore-keys: android-${{ runner.os }}-

      # 5. Cài Rust + targets (repo dùng cargo-ndk bên trong build.sh)
      - name: Install Rust and Android targets
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 6. Cài cargo-ndk (nếu chưa có)
      - name: Install cargo-ndk
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      # 7. Cài dependencies hệ thống cho builder Python
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip pkg-config libssl-dev \
            libxcb1-dev libxkbcommon-dev \
            zip unzip

      # 8. Build từng app (release + debug tùy input)
      - name: Build ${{ matrix.app }} (release)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.appname }}" ]; then EXTRA_ARGS="$EXTRA_ARGS -appname=${{ inputs.appname }}"; fi
          if [ -n "${{ inputs.packagename }}" ]; then EXTRA_ARGS="$EXTRA_ARGS -packagename=${{ inputs.packagename }}"; fi
          bash build.sh -${{ matrix.app }} $EXTRA_ARGS 2>&1 | tee -a logs/build-${{ matrix.app }}-release.log

      - name: Build ${{ matrix.app }} (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_type == 'debug' || inputs.build_type == 'both') }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.appname }}" ]; then EXTRA_ARGS="$EXTRA_ARGS -appname=${{ inputs.appname }}"; fi
          if [ -n "${{ inputs.packagename }}" ]; then EXTRA_ARGS="$EXTRA_ARGS -packagename=${{ inputs.packagename }}"; fi
          bash build-debug.sh -${{ matrix.app }} $EXTRA_ARGS 2>&1 | tee -a logs/build-${{ matrix.app }}-debug.log

      # 9. Upload log nếu build fail (để debug)
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.app }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ github.run_id }}
          path: output/*.apk
          if-no-files-found: warn

  # Job 2: Tổng hợp tất cả APK vào 1 artifact duy nhất
  collect:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          pattern: apk-*
          merge-multiple: true

      - name: List collected APKs
        run: |
          echo "Collected APKs:"
          find all-apks -name "*.apk" -exec ls -lh {} \;

      - name: Upload combined APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks-${{ github.run_id }}
          path: all-apks/
          if-no-files-found: warn
