name: Build ArtCraft APK (manual)

# CHỈ chạy khi bấm "Run workflow" — không auto-build khi push/PR
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App cần build'
        required: true
        default: 'photocraft'
        type: choice
        options:
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft
          - all
      build_type:
        description: 'Loại build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      appname:
        description: 'Override Android display name (để trống = mặc định)'
        required: false
        default: ''
        type: string
      packagename:
        description: 'Override package name (để trống = com.artcraft.<app>)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ inputs.app != 'all' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["photocraft","vectorcraft","filmcraft","lightcraft","pdfcraft","effectcraft","designcraft","figcraft","wordcraft","soundcraft","deckcraft","cadcraft","gridcraft"]') }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Show build info
        run: |
          echo "App:        ${{ matrix.app }}"
          echo "Build type: ${{ inputs.build_type }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
          git log -1 --oneline

      # 2. JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Android SDK — KHÔNG cài "tools" (đã bị Google xóa)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 4. Cache Rust
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      # 5. Cache Android SDK/NDK
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            android-sdk
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('lib/*.py') }}
          restore-keys: android-${{ runner.os }}-

      # 6. Rust + targets
      - name: Install Rust + targets
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 7. cargo-ndk
      - name: Install cargo-ndk
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      # 8. Dependencies hệ thống + Pillow (cho adaptive launcher icons)
      - name: Install system dependencies + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-dev pkg-config libssl-dev \
            libxcb1-dev libxkbcommon-dev zip unzip \
            libjpeg-dev zlib1g-dev libfreetype6-dev

          # Cài Pillow — thử nhiều cách để tương thích Ubuntu 22.04/24.04
          if ! python3 -c "import PIL" 2>/dev/null; then
            echo "Cài Pillow..."
            python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || \
              python3 -m pip install --quiet --user --break-system-packages pillow 2>/dev/null || \
              python3 -m pip install --quiet --user pillow 2>/dev/null || \
              sudo pip3 install --quiet --break-system-packages pillow 2>/dev/null || \
              sudo pip3 install --quiet pillow
          fi

          # Verify
          python3 -c "import PIL; print('Pillow OK:', PIL.__version__)"
          python3 -c "import tomllib; print('tomllib OK')" 2>/dev/null || \
            echo "CẢNH BÁO: tomllib không có — cần Python 3.11+"

      # 9. Build release
      - name: Build ${{ matrix.app }} (release)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          set -o pipefail
          mkdir -p logs
          EXTRA=""
          [ -n "${{ inputs.appname }}" ] && EXTRA="$EXTRA -appname=${{ inputs.appname }}"
          [ -n "${{ inputs.packagename }}" ] && EXTRA="$EXTRA -packagename=${{ inputs.packagename }}"
          bash build.sh -${{ matrix.app }} $EXTRA 2>&1 | tee -a "logs/build-${{ matrix.app }}-release.log"

      # 10. Build debug
      - name: Build ${{ matrix.app }} (debug)
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          set -o pipefail
          mkdir -p logs
          EXTRA=""
          [ -n "${{ inputs.appname }}" ] && EXTRA="$EXTRA -appname=${{ inputs.appname }}"
          [ -n "${{ inputs.packagename }}" ] && EXTRA="$EXTRA -packagename=${{ inputs.packagename }}"
          bash build-debug.sh -${{ matrix.app }} $EXTRA 2>&1 | tee -a "logs/build-${{ matrix.app }}-debug.log"

      # 11. Upload log nếu fail
      - name: Upload logs (nếu fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.app }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ github.run_id }}
          path: output/*.apk
          if-no-files-found: warn

  # Job 2: Gom tất cả APK
  collect:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          pattern: apk-*
          merge-multiple: true

      - name: List APKs
        run: |
          echo "=== APK đã build ==="
          find all-apks -name "*.apk" -exec ls -lh {} \; || echo "(không có APK nào)"

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: ALL-APKs-${{ github.run_id }}
          path: all-apks/
          if-no-files-found: warn
